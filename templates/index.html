<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodot AI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container {
            height: 70vh;
            overflow-y: auto;
        }

        .user-msg {
            background: #dcf8c6;
            align-self: flex-end;
        }

        .bot-msg {
            background: #ffffff;
            align-self: flex-start;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body class="bg-gray-100 font-sans">
    <div class="max-w-4xl mx-auto p-5">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600">Bodot AI Monitor</h1>
            <p class="text-gray-600">Status: <span id="status" class="text-green-500 font-bold">Online</span></p>
        </header>

        <div id="chat-box" class="chat-container flex flex-col space-y-4 p-4 bg-gray-50 rounded-lg shadow-inner">
            {% for msg in history %}
            <div class="p-3 rounded-lg max-w-xs {{ 'user-msg ml-auto' if msg.role == 'user' else 'bot-msg' }}">
                <strong>{{ 'User' if msg.role == 'user' else 'Bodot' }}:</strong>
                <p>{{ msg.content }}</p>
            </div>
            {% endfor %}
        </div>

        <div class="mt-4 text-center">
            <button onclick="fetchHistory()"
                class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition">
                Refresh Histori
            </button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const statusLabel = document.getElementById('status');
        
        // Inisialisasi WebSocket
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        ws.onopen = () => {
            statusLabel.innerText = "Terhubung (Live)";
            statusLabel.className = "text-green-500 font-bold";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            // Tambahkan pesan user ke UI
            appendMessage(data.user, 'user');
            // Tambahkan balasan Bodot ke UI
            appendMessage(data.bot, 'bot');
        };

        ws.onclose = () => {
            statusLabel.innerText = "Terputus";
            statusLabel.className = "text-red-500 font-bold";
        };

        function appendMessage(text, role) {
            if (!text) return;
            const div = document.createElement('div');
            div.className = `p-3 rounded-lg max-w-xs ${role === 'user' ? 'user-msg ml-auto' : 'bot-msg'}`;
            div.innerHTML = `<strong>${role === 'user' ? 'User' : 'Bodot'}:</strong> <p>${text}</p>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>

</html>
